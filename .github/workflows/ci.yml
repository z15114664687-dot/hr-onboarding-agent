name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DEMO_MODE: "true"
      ALLOW_EXTERNAL_AI: "false"
      DATABASE_URL: sqlite:////tmp/hr-onboarding-agent-ci.db
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Compile application
        run: python -m compileall -q app scripts
      - name: Run tests
        run: python -m pytest -q
