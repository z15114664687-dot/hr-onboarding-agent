name: Bug report
description: Report reproducible incorrect behavior using synthetic data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include vulnerabilities, credentials, production URLs, or real HR data. Use the private process in SECURITY.md for security reports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and fictional input data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, demo setting, and provider type. Redact all secrets.

