services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      DEMO_MODE: "false"
      DATABASE_URL: sqlite:////app/data/hr-onboarding.db
      UPLOAD_ROOT: /app/data/uploads
    volumes:
      - hr-onboarding-data:/app/data

  feishu-listener:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      DEMO_MODE: "false"
      DATABASE_URL: sqlite:////app/data/hr-onboarding.db
      UPLOAD_ROOT: /app/data/uploads
    volumes:
      - hr-onboarding-data:/app/data
    command: python -m app.workers.feishu_event_listener
    profiles:
      - integrations

volumes:
  hr-onboarding-data:
